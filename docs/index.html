<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>No Spoilers NBA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --line: #262a33; --text: #eef0f4; --muted: #8b92a1;
    --accent: #ff7a1a; --live: #e5484d; --done: #3a3f4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { max-width: 760px; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; max-width: 760px; margin: 0 auto; scrollbar-width: none; }
  nav button {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; padding: 4px 16px 40px; display: grid; gap: 10px; }
  .game {
    display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px;
  }
  .teams { flex: 1; display: grid; gap: 6px; min-width: 0; }
  .team { display: flex; align-items: center; gap: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team img { width: 28px; height: 28px; flex: none; }
  .team small { color: var(--muted); }
  .action { flex: none; text-align: right; }
  .btn {
    border: 0; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #111;
  }
  .game.watched .btn { background: var(--done); color: var(--text); }
  .tag { font-size: 13px; color: var(--muted); }
  .tag.live { color: var(--live); font-weight: 600; }
  .tag.live::before { content: "● "; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  dialog {
    width: min(960px, 100vw); max-width: 100vw; padding: 0; border: 0; background: #000; color: var(--text);
    border-radius: 12px; overflow: hidden;
  }
  dialog::backdrop { background: rgba(0,0,0,.85); }
  .frame { position: relative; aspect-ratio: 16/9; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; gap: 10px; }
  .bar button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🏀 No Spoilers NBA</h1>
  <div class="sub" id="updated">Loading…</div>
</header>
<nav id="days"></nav>
<main id="games"></main>

<dialog id="player">
  <div class="frame" id="frame"></div>
  <div class="bar"><span id="nowPlaying"></span><button id="close">Close</button></div>
</dialog>

<script>
// Scores are never in data.json, so nothing here can leak one.
const WATCHED_KEY = "watched";
let watched = new Set();
try { watched = new Set(JSON.parse(localStorage.getItem(WATCHED_KEY) || "[]")); } catch {}
const saveWatched = () => { try { localStorage.setItem(WATCHED_KEY, JSON.stringify([...watched])); } catch {} };

const $ = (id) => document.getElementById(id);
let games = [], selected = null;

function dayLabel(iso) {
  const d = new Date(iso + "T12:00:00");
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const diff = Math.round((d - today) / 864e5);
  if (diff === 0) return "Today";
  if (diff === -1) return "Last night";
  if (diff === 1) return "Tomorrow";
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function status(g) {
  if (g.video) return `<button class="btn" data-id="${g.id}">${watched.has(g.id) ? "Rewatch" : "Watch"}</button>`;
  if (g.state === "in") return `<span class="tag live">Live</span>`;
  if (g.state === "post") return `<span class="tag">Highlights soon</span>`;
  const t = new Date(g.tipoff).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return `<span class="tag">${t}</span>`;
}

function render() {
  const days = [...new Set(games.map((g) => g.date))].sort();
  $("days").innerHTML = days.map((d) =>
    `<button class="${d === selected ? "on" : ""}" data-day="${d}">${dayLabel(d)}</button>`).join("");
  const list = games.filter((g) => g.date === selected);
  $("games").innerHTML = list.length ? list.map((g) => `
    <div class="game ${watched.has(g.id) ? "watched" : ""}">
      <div class="teams">
        <div class="team"><img src="${g.away.logo}" alt="">${g.away.name}</div>
        <div class="team"><img src="${g.home.logo}" alt="">${g.home.name} <small>home</small></div>
      </div>
      <div class="action">${status(g)}</div>
    </div>`).join("") : `<div class="empty">No games this day.</div>`;
  const on = document.querySelector("nav .on");
  if (on) $("days").scrollLeft = on.offsetLeft - $("days").clientWidth / 2 + on.clientWidth / 2;
}

function play(g) {
  // rel=0 keeps suggestions to this channel, whose titles don't carry scores
  $("frame").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${g.video}?autoplay=1&rel=0&playsinline=1"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  $("nowPlaying").textContent = `${g.away.nick} at ${g.home.nick}`;
  $("player").showModal();
  watched.add(g.id); saveWatched();
}

function closePlayer() { $("frame").innerHTML = ""; $("player").close(); render(); }

$("days").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  selected = b.dataset.day;
  render();
});
$("games").addEventListener("click", (e) => {
  const b = e.target.closest(".btn"); if (b) play(games.find((g) => g.id === b.dataset.id));
});
$("close").addEventListener("click", closePlayer);
$("player").addEventListener("close", () => { $("frame").innerHTML = ""; render(); });

fetch("data.json?" + Date.now()).then((r) => r.json()).then((d) => {
  games = d.games;
  $("updated").textContent = "Updated " + new Date(d.updated).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
  // Default to the latest day that has highlights you haven't watched, else the latest with any
  const days = [...new Set(games.map((g) => g.date))].sort();
  const withNew = days.filter((day) => games.some((g) => g.date === day && g.video && !watched.has(g.id)));
  const withAny = days.filter((day) => games.some((g) => g.date === day && g.video));
  selected = withNew.at(-1) || withAny.at(-1) || days[0];
  render();
}).catch(() => { $("updated").textContent = "Couldn't load games. Run update.py first."; });
</script>
</body>
</html>
