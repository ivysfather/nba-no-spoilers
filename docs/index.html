<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>No Spoilers NBA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --line: #262a33; --text: #eef0f4; --muted: #8b92a1;
    --accent: #ff7a1a; --live: #e5484d; --done: #3a3f4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { max-width: 760px; margin: 0 auto; padding: 20px 16px 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; max-width: 760px; margin: 0 auto; scrollbar-width: none; }
  nav button {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  nav button.on { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; padding: 4px 16px 40px; display: grid; gap: 10px; }
  .game {
    display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px;
  }
  .teams { flex: 1; display: grid; gap: 6px; min-width: 0; }
  .team { display: flex; align-items: center; gap: 10px; white-space: nowrap; min-width: 0; }
  .team .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .team small, .team .star { flex: none; }
  .team img { width: 28px; height: 28px; flex: none; }
  .team small { color: var(--muted); }
  .action { flex: none; text-align: right; }
  .btn {
    border: 0; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #111;
  }
  .game.watched .btn { background: var(--done); color: var(--text); }
  .tag { font-size: 13px; color: var(--muted); }
  .tag.live { color: var(--live); font-weight: 600; }
  .tag.live::before { content: "● "; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  dialog {
    width: min(960px, 100vw); max-width: 100vw; padding: 0; border: 0; background: #000; color: var(--text);
    border-radius: 12px; overflow: hidden;
  }
  dialog::backdrop { background: rgba(0,0,0,.85); }
  .frame { position: relative; aspect-ratio: 16/9; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; gap: 10px; }
  .bar button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .game.fav { border-color: var(--accent); }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .spoil {
    flex: none; border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 600;
    background: var(--live); color: #fff; cursor: pointer;
  }
  .spoil.on { background: none; border: 1px solid var(--live); color: var(--live); }
  .score { margin-left: auto; padding-left: 10px; font-variant-numeric: tabular-nums; color: var(--muted); flex: none; }
  .score.win { color: var(--text); font-weight: 700; }
  .result { font-size: 13px; color: var(--muted); }
  .result a { color: var(--live); text-decoration: none; margin-left: 6px; }
  .star { color: var(--accent); margin-left: -4px; }
  nav button .dot { color: var(--accent); margin-left: 4px; }
  nav button.on .dot { color: #111; }
  /* Covers YouTube's "More videos" panel on pause and its end screen. Leaves the
     bottom control bar uncovered so scrubbing still works. */
  .cover {
    position: absolute; inset: 0 0 52px 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; background: #000; z-index: 2;
  }
  .cover.show { display: flex; }
  .cover button { border: 0; border-radius: 999px; padding: 14px 26px; font: inherit; font-weight: 600; background: var(--accent); color: #111; cursor: pointer; }
  .cover.done { inset: 0; }
  .cover p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>🏀 No Spoilers NBA</h1>
    <div class="sub" id="updated">Loading…</div>
  </div>
  <button class="spoil" id="spoil">Show scores</button>
</header>
<nav id="days"></nav>
<main id="games"></main>

<dialog id="player">
  <div class="frame"><div id="frame"></div><div class="cover" id="cover"></div></div>
  <div class="bar"><span id="nowPlaying"></span><button id="close">Close</button></div>
</dialog>

<script>
// Scores are never in data.json, so nothing here can leak one.
const WATCHED_KEY = "watched";
let watched = new Set();
try { watched = new Set(JSON.parse(localStorage.getItem(WATCHED_KEY) || "[]")); } catch {}
const saveWatched = () => { try { localStorage.setItem(WATCHED_KEY, JSON.stringify([...watched])); } catch {} };

const FAVORITES = ["Warriors", "Timberwolves"];
const isFav = (g) => FAVORITES.includes(g.home.nick) || FAVORITES.includes(g.away.nick);

const $ = (id) => document.getElementById(id);
let games = [], selected = null;
// Scores are fetched from ESPN only when you ask, for one day, and forgotten on day change or reload.
let scores = null;

function dayLabel(iso) {
  const d = new Date(iso + "T12:00:00");
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const diff = Math.round((d - today) / 864e5);
  if (diff === 0) return "Today";
  if (diff === -1) return "Last night";
  if (diff === 1) return "Tomorrow";
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function status(g) {
  if (g.video) return `<button class="btn" data-id="${g.id}">${watched.has(g.id) ? "Rewatch" : "Watch"}</button>`;
  if (g.state === "in") return `<span class="tag live">Live</span>`;
  if (g.state === "post") return `<span class="tag">Highlights soon</span>`;
  const t = new Date(g.tipoff).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return `<span class="tag">${t}</span>`;
}

function scoreFor(t) {
  const s = scores?.teams[t.abbr + "@" + selected];
  return s ? `<span class="score ${s.win ? "win" : ""}">${s.score}</span>` : "";
}

function resultLine(g) {
  const r = scores?.games[g.id];
  if (!r) return "";
  return `<div class="result">${r.detail}<a href="https://www.espn.com/nba/boxscore/_/gameId/${g.id}" target="_blank" rel="noopener">Box score ↗</a></div>`;
}

async function showScores() {
  const label = $("days").querySelector(".on")?.textContent.replace("★", "") || "this day";
  if (!confirm(`Show scores for ${label}? This reveals results.`)) return;
  const raw = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${selected.replaceAll("-", "")}`)
    .then((r) => r.json());
  scores = { day: selected, teams: {}, games: {} };
  for (const e of raw.events || []) {
    const comp = e.competitions[0];
    if (e.status.type.state === "pre") continue;
    scores.games[e.id] = { detail: e.status.type.shortDetail };
    for (const c of comp.competitors)
      scores.teams[c.team.abbreviation + "@" + selected] = { score: c.score, win: !!c.winner };
  }
  render();
}

function hideScores() { scores = null; render(); }

function render() {
  if (scores && scores.day !== selected) scores = null;
  $("spoil").textContent = scores ? "Hide scores" : "Show scores";
  $("spoil").classList.toggle("on", !!scores);
  const days = [...new Set(games.map((g) => g.date))].sort();
  $("days").innerHTML = days.map((d) =>
    `<button class="${d === selected ? "on" : ""}" data-day="${d}">${dayLabel(d)}${
      games.some((g) => g.date === d && isFav(g)) ? '<span class="dot">★</span>' : ""}</button>`).join("");
  // Favorites first, then by tip-off
  const list = games.filter((g) => g.date === selected)
    .sort((a, b) => isFav(b) - isFav(a) || a.tipoff.localeCompare(b.tipoff));
  const team = (t, home) => `<div class="team"><img src="${t.logo}" alt=""><span class="nm">${t.name}</span>${
    FAVORITES.includes(t.nick) ? '<span class="star">★</span>' : ""}${home ? " <small>home</small>" : ""}${scoreFor(t)}</div>`;
  $("games").innerHTML = list.length ? list.map((g) => `
    <div class="game ${watched.has(g.id) ? "watched" : ""} ${isFav(g) ? "fav" : ""}">
      <div class="teams">${team(g.away, false)}${team(g.home, true)}${resultLine(g)}</div>
      <div class="action">${status(g)}</div>
    </div>`).join("") : `<div class="empty">No games this day.</div>`;
  const on = document.querySelector("nav .on");
  if (on) $("days").scrollLeft = on.offsetLeft - $("days").clientWidth / 2 + on.clientWidth / 2;
}

// YouTube's player API lets us cover its suggested videos (pause panel, end screen).
let player = null, current = null, apiReady = null;
function loadApi() {
  apiReady ??= new Promise((resolve) => {
    window.onYouTubeIframeAPIReady = resolve;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  });
  return apiReady;
}

function showCover(kind) {
  const c = $("cover");
  c.className = "cover show" + (kind === "done" ? " done" : "");
  c.innerHTML = kind === "done"
    ? `<p>That's the game.</p><button id="again">Watch again</button>`
    : `<button id="resume">▶ Resume</button>`;
}
function hideCover() { $("cover").className = "cover"; $("cover").innerHTML = ""; }

function exitFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (document.webkitFullscreenElement) document.webkitExitFullscreen?.();
}

async function play(g) {
  current = g;
  $("nowPlaying").textContent = `${g.away.nick} at ${g.home.nick}`;
  $("player").showModal();
  watched.add(g.id); saveWatched();
  hideCover();
  await loadApi();
  destroyPlayer();
  player = new YT.Player("frame", {
    host: "https://www.youtube-nocookie.com",
    videoId: g.video,
    playerVars: { autoplay: 1, rel: 0, playsinline: 1, iv_load_policy: 3, modestbranding: 1 },
    events: {
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.PLAYING) hideCover();
        else if (e.data === YT.PlayerState.PAUSED) showCover("paused");
        else if (e.data === YT.PlayerState.ENDED) {
          exitFullscreen();
          destroyPlayer();
          showCover("done");
        }
      },
    },
  });
}

function destroyPlayer() {
  if (player) { player.destroy(); player = null; }
  if (!$("frame")) $("cover").insertAdjacentHTML("beforebegin", '<div id="frame"></div>');
}

$("cover").addEventListener("click", (e) => {
  if (e.target.id === "resume") player?.playVideo();
  if (e.target.id === "again") play(current);
});

function closePlayer() { destroyPlayer(); hideCover(); $("player").close(); render(); }

$("days").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  selected = b.dataset.day;
  render();
});
$("games").addEventListener("click", (e) => {
  const b = e.target.closest(".btn"); if (b) play(games.find((g) => g.id === b.dataset.id));
});
$("close").addEventListener("click", closePlayer);
$("spoil").addEventListener("click", () => (scores ? hideScores() : showScores()));
$("player").addEventListener("close", () => { destroyPlayer(); hideCover(); render(); });

fetch("data.json?" + Date.now()).then((r) => r.json()).then((d) => {
  games = d.games;
  $("updated").textContent = "Updated " + new Date(d.updated).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
  // Default to the latest day that has highlights you haven't watched, else the latest with any
  const days = [...new Set(games.map((g) => g.date))].sort();
  const withNew = days.filter((day) => games.some((g) => g.date === day && g.video && !watched.has(g.id)));
  const withAny = days.filter((day) => games.some((g) => g.date === day && g.video));
  selected = withNew.at(-1) || withAny.at(-1) || days[0];
  render();
}).catch(() => { $("updated").textContent = "Couldn't load games. Run update.py first."; });
</script>
</body>
</html>
